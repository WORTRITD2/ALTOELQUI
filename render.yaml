# Despliegue con un clic en Render (New → Blueprint → este repositorio).
# Este único servicio sirve la API Y la interfaz: la dirección que entrega Render
# abre la aplicación completa. Publicarla además en Netlify es opcional.
services:
  - type: web
    name: obra-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .          # la raíz: así la imagen incluye frontend/ y plantilla/
    plan: free
    healthCheckPath: /salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: obra-db
          property: connectionString
      - key: SEMBRAR_AL_ARRANCAR
        value: "1"           # carga la obra de referencia si la base está vacía
      - key: ORIGENES_PERMITIDOS
        sync: false          # solo si publicas la interfaz aparte (Netlify)
      - key: BCCH_USER
        sync: false          # opcional: credenciales del Banco Central
      - key: BCCH_PASS
        sync: false

databases:
  - name: obra-db
    plan: free
    databaseName: obra
